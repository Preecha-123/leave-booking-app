<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ระบบจองวันลาและตารางเวรปฏิบัติงาน</title>
  <style>
    /* บังคับหน้าจอให้พอดีกับขนาดหน้าจอมือถือ ไม่เกิดช่องว่าง */
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      width: 100%;
      overflow: hidden; 
      background-color: #f4f6f9;
      /* ป้องกันการเลื่อนเด้งไปมาบน iOS Safari */
      -webkit-overflow-scrolling: touch; 
    }
    
    /* ตั้งค่า iframe ให้รองรับการทำงานระบบสัมผัสของมือถืออย่างสมบูรณ์ */
    .iframe-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
      display: block;
    }
  </style>
</head>
<body>
  <div class="iframe-wrapper">
    <!-- ดึงลิงก์เว็บแอปตัวจริงที่ลงท้ายด้วย /exec ของคุณ -->
    <iframe src="https://script.google.com/macros/s/AKfycbwntZpp8SyI6dFUuNUHt0Jg949opXfjk4bMjQitHKoWk16IzuFxEv9ZkSFE_ABb_OIk/exec"></iframe>
  </div>
</body>
</html>
