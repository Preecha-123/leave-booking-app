<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ตารางเวรและการลาประจำเดือน</title>
  <style>
    body, html { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      width: 100%;
      overflow: hidden; 
      background-color: #f4f6f9;
      font-family: 'Sarabun', sans-serif;
    }
    .iframe-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    iframe { 
      width: 100%; 
      height: 100%; 
      border: none; 
      display: block;
    }
    /* ปุ่มลอยสำหรับกดสลับไปหน้าจองวันลา */
    .floating-nav {
      position: fixed;
      bottom: 18px;
      right: 18px;
      z-index: 9999;
      background-color: #2563eb;
      color: #ffffff;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: bold;
      box-shadow: 0 4px 12px rgba(37,99,235,0.3);
      transition: transform 0.2s, background-color 0.2s;
    }
    .floating-nav:hover {
      background-color: #1d4ed8;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="iframe-wrapper">
    <!-- เรียกหน้าตารางเวรและการลา (?page=view) -->
    <iframe src="https://script.google.com/macros/s/AKfycbx_WbMgoENzB9iCSaav_ZO8KrN7IElvktgRKdvz9g2H/exec?page=view"></iframe>
  </div>

  <!-- ปุ่มกดกลับไปหน้าจองวันลา (ถ้าเปิดโชว์บนจอทีวีและไม่อยากให้มีปุ่ม ลบบรรทัดนี้ออกได้เลยครับ) -->
  <a href="index.html" class="floating-nav">📅 ไปหน้าจองวันลา</a>
</body>
</html>
